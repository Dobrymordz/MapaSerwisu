<div class="page">

    <h1>
        <i class="fa-solid fa-gear"></i>
        Ustawienia
    </h1>

    <div class="settings-card">

        <h2>
            <i class="fa-solid fa-lock"></i>
            Zmiana hasła
        </h2>

        <label for="currentPassword">Aktualne hasło</label>

        <div class="password-box">
            <input
                type="password"
                id="currentPassword"
                placeholder="Wpisz aktualne hasło">

            <button class="eye-btn" type="button" onclick="togglePassword('currentPassword', this)">
                <i class="fa-solid fa-eye"></i>
            </button>
        </div>

        <label for="newPassword">Nowe hasło</label>

        <div class="password-box">
            <input
                type="password"
                id="newPassword"
                placeholder="Wpisz nowe hasło">

            <button class="eye-btn" type="button" onclick="togglePassword('newPassword', this)">
                <i class="fa-solid fa-eye"></i>
            </button>
        </div>

        <label for="repeatPassword">Powtórz nowe hasło</label>

        <div class="password-box">
            <input
                type="password"
                id="repeatPassword"
                placeholder="Powtórz nowe hasło">

            <button class="eye-btn" type="button" onclick="togglePassword('repeatPassword', this)">
                <i class="fa-solid fa-eye"></i>
            </button>
        </div>

        <button class="save-btn" onclick="changePassword()">
            <i class="fa-solid fa-floppy-disk"></i>
            Zmień hasło
        </button>

        <div id="passwordMessage"></div>

    </div>

</div>
