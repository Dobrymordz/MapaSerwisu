<link rel="stylesheet" href="../css/login.css">
<div class="login-page">

    <div class="login-card">

        <img src="assets/logo.png" class="login-logo">

        <h1>Technologia Plus</h1>

        <p>Service Manager</p>

        <form id="loginForm">

            <label>Login</label>

            <input
                type="text"
                id="login"
                placeholder="Login">

            <label>Hasło</label>

            <input
                type="password"
                id="password"
                placeholder="Hasło">

            <div class="remember">

                <input
                    type="checkbox"
                    id="remember">

                <label for="remember">
                    Zapamiętaj mnie
                </label>

            </div>

            <button type="submit">
                Zaloguj się
            </button>

        </form>

    </div>

</div>
