<div class="calendar-page">

    <div class="calendar-header">

        <div class="calendar-navigation">

            <button id="prevMonth">‹</button>

            <h1 id="calendarTitle">Sierpień 2026</h1>

            <button id="nextMonth">›</button>

        </div>

        <button id="todayButton">Dzisiaj</button>

    </div>

    <div class="calendar-week">

        <div>Poniedziałek</div>
        <div>Wtorek</div>
        <div>Środa</div>
        <div>Czwartek</div>
        <div>Piątek</div>
        <div>Sobota</div>
        <div>Niedziela</div>

    </div>

    <div id="calendarGrid" class="calendar-grid"></div>
    <div id="calendarGrid" class="calendar-grid"></div>
    <div id="taskModal" class="task-modal">

    <div class="task-modal-content">

        <button id="closeTaskModal" class="task-modal-close">
            ×
        </button>

        <h2 id="modalTaskTitle">
            Szczegóły zlecenia
        </h2>

        <div class="task-modal-details">

            <div>
                <strong>Klient:</strong>
                <span id="modalCustomer"></span>
            </div>

            <div>
                <strong>Miasto:</strong>
                <span id="modalCity"></span>
            </div>

            <div>
                <strong>Adres:</strong>
                <span id="modalAddress"></span>
            </div>

            <div>
                <strong>Serwisant:</strong>
                <span id="modalTechnician"></span>
            </div>

            <div>
                <strong>Data:</strong>
                <span id="modalDate"></span>
            </div>

            <div>
                <strong>Godzina:</strong>
                <span id="modalTime"></span>
            </div>

            <div>
                <strong>Status:</strong>
                <span id="modalStatus"></span>
            </div>

            <div>
                <strong>Priorytet:</strong>
                <span id="modalPriority"></span>
            </div>

        </div>

        <button id="showOnMapButton" class="show-on-map">
            📍 Pokaż na mapie
        </button>

    </div>


</div>
